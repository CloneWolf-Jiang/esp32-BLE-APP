name: Build signed release APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and upload signed Android 5–16 APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -mindepth 3 -maxdepth 3 -type f -name sdkmanager | sort -V | tail -1)"
          python3 - "$SDKMANAGER" <<'PY'
          import subprocess
          import sys

          result = subprocess.run([sys.argv[1], "--licenses"], input="y\n" * 100, text=True)
          raise SystemExit(result.returncode)
          PY
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build, sign, and verify release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing Actions secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing Actions secret ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing Actions secret ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing Actions secret ANDROID_KEY_PASSWORD}"

          KEYSTORE_PATH="$RUNNER_TEMP/release-signing.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          export RELEASE_STORE_FILE="$KEYSTORE_PATH"
          export RELEASE_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          export RELEASE_KEY_ALIAS="$ANDROID_KEY_ALIAS"
          export RELEASE_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          ./gradlew --no-daemon clean testDebugUnitTest assembleRelease

          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/esp32-ble-app-release.apk
          keytool -exportcert -rfc \
            -keystore "$KEYSTORE_PATH" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -file release/esp32-ble-release-cert.pem
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test "$("$SDK/cmdline-tools/latest/bin/apkanalyzer" manifest min-sdk release/esp32-ble-app-release.apk)" = "21"
          test "$("$SDK/cmdline-tools/latest/bin/apkanalyzer" manifest target-sdk release/esp32-ble-app-release.apk)" = "36"
          "$SDK/build-tools/36.0.0/apksigner" verify release/esp32-ble-app-release.apk
          sha256sum release/esp32-ble-app-release.apk release/esp32-ble-release-cert.pem > release/SHA256SUMS.txt

      - name: Upload downloadable files
        uses: actions/upload-artifact@v4
        with:
          name: esphome-ble-app-release
          path: |
            release/esp32-ble-app-release.apk
            release/esp32-ble-release-cert.pem
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
