name: Publish test APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and upload Android 5–16 test APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -mindepth 3 -maxdepth 3 -type f -name sdkmanager | sort -V | tail -1)"
          python3 - "$SDKMANAGER" <<'PY'
          import subprocess
          import sys

          result = subprocess.run([sys.argv[1], "--licenses"], input="y\n" * 100, text=True)
          raise SystemExit(result.returncode)
          PY
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Create temporary debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storetype JKS \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storepass android \
            -keypass android

      - name: Build and test APK
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug

      - name: Export debug signing certificate
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/esp32-ble-app-test.apk
          keytool -exportcert -rfc \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -file release/esp32-ble-test-cert.pem

      - name: Verify SDK compatibility and APK signature
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test "$("$SDK/cmdline-tools/latest/bin/apkanalyzer" manifest min-sdk release/esp32-ble-app-test.apk)" = "21"
          test "$("$SDK/cmdline-tools/latest/bin/apkanalyzer" manifest target-sdk release/esp32-ble-app-test.apk)" = "36"
          "$SDK/build-tools/36.0.0/apksigner" verify release/esp32-ble-app-test.apk

      - name: Create SHA-256 checksums
        run: sha256sum release/esp32-ble-app-test.apk release/esp32-ble-test-cert.pem > release/SHA256SUMS.txt

      - name: Upload downloadable files
        uses: actions/upload-artifact@v4
        with:
          name: esphome-ble-app-test
          path: |
            release/esp32-ble-app-test.apk
            release/esp32-ble-test-cert.pem
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
